name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # For a project site (username.github.io/repo) the base path must match the repo name.
      # For a user site (username.github.io) leave BASE_PATH unset.
      # Resolve Firebase web config into VITE_* env for the build.
      # Accepts EITHER a single `FIREBASE` secret holding the JSON config object,
      # OR five individual VITE_FIREBASE_* secrets (individual wins if set).
      - name: Resolve Firebase config
        env:
          FIREBASE_JSON: ${{ secrets.FIREBASE }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          # Fallback for configs copied before the Realtime Database existed (not secret).
          FIREBASE_DATABASE_URL: ${{ vars.FIREBASE_DATABASE_URL }}
        run: |
          set -e
          put() { printf '%s=%s\n' "$1" "$2" >> "$GITHUB_ENV"; }
          if [ -n "$VITE_FIREBASE_API_KEY" ]; then
            echo "Using individual VITE_FIREBASE_* secrets."
            put VITE_FIREBASE_API_KEY      "$VITE_FIREBASE_API_KEY"
            put VITE_FIREBASE_AUTH_DOMAIN  "$VITE_FIREBASE_AUTH_DOMAIN"
            put VITE_FIREBASE_DATABASE_URL "${VITE_FIREBASE_DATABASE_URL:-$FIREBASE_DATABASE_URL}"
            put VITE_FIREBASE_PROJECT_ID   "$VITE_FIREBASE_PROJECT_ID"
            put VITE_FIREBASE_APP_ID       "$VITE_FIREBASE_APP_ID"
          elif [ -n "$FIREBASE_JSON" ]; then
            echo "Normalizing FIREBASE secret (accepts JSON or a JS config snippet)."
            norm=$(printf '%s' "$FIREBASE_JSON" | tr '\n' ' ')
            # isolate the outermost { ... } (handles `const firebaseConfig = {..};` wrappers)
            case "$norm" in *"{"*) norm="{${norm#*\{}"; norm="${norm%\}*}}";; esac
            # single->double quotes, quote unquoted keys, drop trailing commas
            norm=$(printf '%s' "$norm" | sed -E "s/'/\"/g; s/([{,])[[:space:]]*([A-Za-z_][A-Za-z0-9_]*)[[:space:]]*:/\1\"\2\":/g; s/,[[:space:]]*}/}/g")
            if printf '%s' "$norm" | jq empty 2>/dev/null; then
              get() { printf '%s' "$norm" | jq -r ".$1 // empty"; }
              apiKey=$(get apiKey); authDomain=$(get authDomain); projectId=$(get projectId); appId=$(get appId)
              databaseURL=$(get databaseURL); [ -z "$databaseURL" ] && databaseURL="$FIREBASE_DATABASE_URL"
              put VITE_FIREBASE_API_KEY      "$apiKey"
              put VITE_FIREBASE_AUTH_DOMAIN  "$authDomain"
              put VITE_FIREBASE_DATABASE_URL "$databaseURL"
              put VITE_FIREBASE_PROJECT_ID   "$projectId"
              put VITE_FIREBASE_APP_ID       "$appId"
              miss=""
              for k in apiKey authDomain databaseURL projectId appId; do [ -z "${!k}" ] && miss="$miss $k"; done
              if [ -n "$miss" ]; then echo "::warning::Firebase config missing:$miss (Firebase stays disabled)"; else echo "Firebase config complete."; fi
            else
              echo "::warning::Could not parse FIREBASE secret; building WITHOUT Firebase. Set it to your firebaseConfig JSON object."
            fi
          else
            echo "No Firebase secret set — building without Firebase (DB features disabled)."
          fi

      - run: npm run build
        env:
          BASE_PATH: ${{ vars.BASE_PATH }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
